name: Compilar PhysEx Water 1.20.1 Forge

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar ambiente
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Gerar todo o projeto e codigo do mod
        run: |
          mkdir -p src/main/java/com/physexwater src/main/resources/META-INF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven {
                      name = 'MinecraftForge'
                      url = 'https://maven.minecraftforge.net/'
                  }
              }
          }

          plugins {
              id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
          }
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'eclipse'
              id 'idea'
              id 'maven-publish'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }

          version = '1.0.0'
          group = 'com.physexwater'

          base {
              archivesName = 'physexwater-1.20.1'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.20.1'
              copyIdeResources = true
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
          }

          tasks.named('jar', Jar).configure {
              manifest {
                  attributes([
                      'Specification-Title'     : 'physexwater',
                      'Specification-Vendor'    : 'PhysExWater',
                      'Specification-Version'   : '1',
                      'Implementation-Title'    : project.name,
                      'Implementation-Version'  : project.jar.archiveVersion,
                      'Implementation-Vendor'   : 'PhysExWater'
                  ])
              }
              finalizedBy 'reobfJar'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

          cat << 'EOF' > src/main/resources/pack.mcmeta
          {
            "pack": {
              "description": "PhysEx Water Physics Overhaul resources",
              "pack_format": 15
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/META-INF/mods.toml
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"

          [[mods]]
          modId="physexwater"
          version="1.0.0"
          displayName="PhysEx Water Physics Overhaul"
          description='''Fisica realista de agua finita: gravidade, pressao, drenagem, deslocamento por blocos, infiltracao, chuva, evaporacao e correntezas.'''

          [[dependencies.physexwater]]
          modId="forge"
          mandatory=true
          versionRange="[47.2.0,)"
          ordering="NONE"
          side="BOTH"

          [[dependencies.physexwater]]
          modId="minecraft"
          mandatory=true
          versionRange="[1.20.1,1.21)"
          ordering="NONE"
          side="BOTH"
          EOF

          cat << 'EOF' > src/main/java/com/physexwater/PhysExWaterMod.java
          package com.physexwater;

          import net.minecraftforge.common.MinecraftForge;
          import net.minecraftforge.fml.ModLoadingContext;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.config.ModConfig;

          @Mod(PhysExWaterMod.MODID)
          public class PhysExWaterMod {
              public static final String MODID = "physexwater";

              public PhysExWaterMod() {
                  ModLoadingContext.get().registerConfig(ModConfig.Type.COMMON, PhysExConfig.SPEC);
                  MinecraftForge.EVENT_BUS.register(new WaterPhysicsEngine());
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/physexwater/PhysExConfig.java
          package com.physexwater;

          import net.minecraftforge.common.ForgeConfigSpec;

          public class PhysExConfig {
              public static final ForgeConfigSpec SPEC;

              public static final ForgeConfigSpec.BooleanValue DISABLE_INFINITE_WATER;
              public static final ForgeConfigSpec.BooleanValue ENABLE_GRAVITY;
              public static final ForgeConfigSpec.BooleanValue ENABLE_LATERAL_FLOW;
              public static final ForgeConfigSpec.BooleanValue ENABLE_DISPLACEMENT;
              public static final ForgeConfigSpec.BooleanValue ENABLE_SEEPAGE;
              public static final ForgeConfigSpec.BooleanValue ENABLE_RAIN_REFILL;
              public static final ForgeConfigSpec.BooleanValue ENABLE_EVAPORATION;
              public static final ForgeConfigSpec.BooleanValue ENABLE_STRONG_CURRENTS;

              public static final ForgeConfigSpec.IntValue TICK_INTERVAL;
              public static final ForgeConfigSpec.IntValue MAX_UPDATES_PER_TICK;
              public static final ForgeConfigSpec.IntValue SCAN_RADIUS;
              public static final ForgeConfigSpec.IntValue AMBIENT_SAMPLES_PER_PLAYER;
              public static final ForgeConfigSpec.IntValue DRAIN_SEARCH_RANGE;

              static {
                  ForgeConfigSpec.Builder builder = new ForgeConfigSpec.Builder();

                  builder.push("mecanicas_agua");
                  DISABLE_INFINITE_WATER = builder
                          .comment("Desativa a criacao de fontes infinitas de agua (agua finita)")
                          .define("desativarAguaInfinita", true);
                  ENABLE_GRAVITY = builder
                          .comment("Agua cai com gravidade e drena tanques/lagos")
                          .define("ativarGravidade", true);
                  ENABLE_LATERAL_FLOW = builder
                          .comment("Agua escoa lateralmente por pressao e busca desniveis")
                          .define("ativarEscoamentoLateral", true);
                  ENABLE_DISPLACEMENT = builder
                          .comment("Colocar blocos na agua empurra a agua para o lado ou para cima")
                          .define("ativarDeslocamentoPorBlocos", true);
                  ENABLE_SEEPAGE = builder
                          .comment("Agua infiltra atraves de blocos porosos (folhas e grades de ferro)")
                          .define("ativarInfiltracaoPorosa", true);
                  ENABLE_RAIN_REFILL = builder
                          .comment("Chuva enche lentamente bacias e buracos expostos ao ceu")
                          .define("ativarRecargaPelaChuva", true);
                  ENABLE_EVAPORATION = builder
                          .comment("Agua rasa evapora sob o sol em biomas muito quentes")
                          .define("ativarEvaporacao", true);
                  ENABLE_STRONG_CURRENTS = builder
                          .comment("Correntezas de agua empurram entidades com mais forca")
                          .define("ativarCorrentezasFortes", true);
                  builder.pop();

                  builder.push("desempenho");
                  TICK_INTERVAL = builder
                          .comment("Intervalo em ticks entre atualizacoes de fisica (menor = mais rapido)")
                          .defineInRange("intervaloTicks", 2, 1, 20);
                  MAX_UPDATES_PER_TICK = builder
                          .comment("Maximo de blocos de agua simulados por ciclo")
                          .defineInRange("maxAtualizacoesPorCiclo", 96, 8, 1024);
                  SCAN_RADIUS = builder
                          .comment("Raio em blocos ao redor do jogador para simulacao ambiente")
                          .defineInRange("raioSimulacao", 24, 8, 64);
                  AMBIENT_SAMPLES_PER_PLAYER = builder
                          .comment("Quantidade de blocos aleatorios checados por jogador por ciclo")
                          .defineInRange("amostrasAmbientePorJogador", 36, 4, 256);
                  DRAIN_SEARCH_RANGE = builder
                          .comment("Distancia horizontal que a agua procura por um desnivel para escoar")
                          .defineInRange("alcanceBuscaDesnivel", 4, 1, 8);
                  builder.pop();

                  SPEC = builder.build();
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/physexwater/WaterPhysicsEngine.java
          package com.physexwater;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.tags.BlockTags;
          import net.minecraft.util.RandomSource;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.material.Fluids;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.event.entity.living.LivingEvent;
          import net.minecraftforge.event.level.BlockEvent;
          import net.minecraftforge.eventbus.api.Event;
          import net.minecraftforge.eventbus.api.SubscribeEvent;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          public class WaterPhysicsEngine {

              private final Map<ResourceKey<Level>, ArrayDeque<BlockPos>> activeQueues = new HashMap<>();
              private final Map<ResourceKey<Level>, Set<BlockPos>> queuedSets = new HashMap<>();
              private static final int MAX_QUEUE_SIZE = 4096;

              @SubscribeEvent
              public void onCreateFluidSource(BlockEvent.CreateFluidSourceEvent event) {
                  if (!PhysExConfig.DISABLE_INFINITE_WATER.get()) {
                      return;
                  }
                  if (event.getState().getFluidState().is(Fluids.WATER)) {
                      event.setResult(Event.Result.DENY);
                  }
              }

              @SubscribeEvent
              public void onBreakBlock(BlockEvent.BreakEvent event) {
                  if (event.getLevel() instanceof ServerLevel serverLevel) {
                      enqueueRegion(serverLevel, event.getPos());
                  }
              }

              @SubscribeEvent
              public void onPlaceBlock(BlockEvent.EntityPlaceEvent event) {
                  if (!(event.getLevel() instanceof ServerLevel serverLevel)) {
                      return;
                  }
                  BlockPos pos = event.getPos();
                  BlockState replaced = event.getBlockSnapshot().getReplacedBlock();
                  BlockState placed = event.getPlacedBlock();

                  if (PhysExConfig.ENABLE_DISPLACEMENT.get()
                          && isWaterSource(replaced)
                          && !placed.is(Blocks.WATER)
                          && !placed.isAir()) {
                      displaceWater(serverLevel, pos);
                  }

                  enqueueRegion(serverLevel, pos);
              }

              @SubscribeEvent
              public void onLivingTick(LivingEvent.LivingTickEvent event) {
                  if (!PhysExConfig.ENABLE_STRONG_CURRENTS.get()) {
                      return;
                  }
                  LivingEntity entity = event.getEntity();
                  if (entity.level().isClientSide || !entity.isInWater()) {
                      return;
                  }
                  BlockPos pos = entity.blockPosition();
                  Vec3 flow = entity.level().getFluidState(pos).getFlow(entity.level(), pos);
                  if (flow.lengthSqr() > 0.001D) {
                      entity.setDeltaMovement(entity.getDeltaMovement().add(flow.scale(0.055D)));
                      entity.hurtMarked = true;
                  }
              }

              @SubscribeEvent
              public void onLevelTick(TickEvent.LevelTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) {
                      return;
                  }
                  if (!(event.level instanceof ServerLevel level)) {
                      return;
                  }
                  if (level.players().isEmpty()) {
                      return;
                  }

                  int interval = PhysExConfig.TICK_INTERVAL.get();
                  if (level.getGameTime() % interval != 0) {
                      return;
                  }

                  processActiveQueue(level);
                  runAmbientScan(level);
              }

              private void processActiveQueue(ServerLevel level) {
                  ResourceKey<Level> dim = level.dimension();
                  ArrayDeque<BlockPos> queue = activeQueues.get(dim);
                  Set<BlockPos> set = queuedSets.get(dim);
                  if (queue == null || queue.isEmpty()) {
                      return;
                  }

                  int budget = PhysExConfig.MAX_UPDATES_PER_TICK.get();
                  int processed = 0;

                  while (processed < budget && !queue.isEmpty()) {
                      BlockPos pos = queue.pollFirst();
                      if (set != null) {
                          set.remove(pos);
                      }
                      if (pos != null && level.isLoaded(pos)) {
                          simulateWaterAt(level, pos);
                          processed++;
                      }
                  }
              }

              private void runAmbientScan(ServerLevel level) {
                  RandomSource random = level.getRandom();
                  int radius = PhysExConfig.SCAN_RADIUS.get();
                  int samples = PhysExConfig.AMBIENT_SAMPLES_PER_PLAYER.get();

                  for (ServerPlayer player : level.players()) {
                      BlockPos center = player.blockPosition();
                      for (int i = 0; i < samples; i++) {
                          int dx = random.nextInt(radius * 2 + 1) - radius;
                          int dy = random.nextInt(radius + 1) - (radius / 2);
                          int dz = random.nextInt(radius * 2 + 1) - radius;
                          BlockPos pos = center.offset(dx, dy, dz);

                          if (!level.isLoaded(pos) || pos.getY() <= level.getMinBuildHeight() + 1) {
                              continue;
                          }

                          BlockState state = level.getBlockState(pos);
                          if (isWaterSource(state)) {
                              if (PhysExConfig.ENABLE_EVAPORATION.get() && tryEvaporate(level, pos, random)) {
                                  continue;
                              }
                              simulateWaterAt(level, pos);
                          } else if (PhysExConfig.ENABLE_RAIN_REFILL.get() && state.isAir()) {
                              tryRainRefill(level, pos, random);
                          }
                      }
                  }
              }

              private void simulateWaterAt(ServerLevel level, BlockPos pos) {
                  BlockState state = level.getBlockState(pos);
                  if (!isWaterSource(state)) {
                      return;
                  }

                  // 1. Gravidade direta
                  if (PhysExConfig.ENABLE_GRAVITY.get()) {
                      BlockPos below = pos.below();
                      if (canWaterMoveInto(level, below)) {
                          moveWater(level, pos, below);
                          return;
                      }

                      // 2. Infiltracao por blocos porosos (folhas / grades)
                      if (PhysExConfig.ENABLE_SEEPAGE.get() && isPorous(level.getBlockState(below))) {
                          BlockPos belowPorous = pos.below(2);
                          if (canWaterMoveInto(level, belowPorous)) {
                              moveWater(level, pos, belowPorous);
                              return;
                          }
                      }

                      // 3. Queda diagonal em bordas e escadas
                      List<Direction> dirs = shuffledHorizontalDirections();
                      for (Direction dir : dirs) {
                          BlockPos side = pos.relative(dir);
                          BlockPos sideBelow = side.below();
                          if (canWaterMoveInto(level, side) && canWaterMoveInto(level, sideBelow)) {
                              moveWater(level, pos, sideBelow);
                              return;
                          }
                      }
                  }

                  // 4. Escoamento lateral (pressao hidrostatica e drenagem para desniveis)
                  if (PhysExConfig.ENABLE_LATERAL_FLOW.get()) {
                      List<Direction> dirs = shuffledHorizontalDirections();
                      boolean hasWaterAbove = isWaterSource(level.getBlockState(pos.above()));

                      // Pressao de coluna d'agua empurra agua da base para os lados livres
                      if (hasWaterAbove) {
                          for (Direction dir : dirs) {
                              BlockPos side = pos.relative(dir);
                              if (canWaterMoveInto(level, side)) {
                                  moveWater(level, pos, side);
                                  return;
                              }
                          }
                      }

                      // Procura desnivel proximo para drenar reservatorios e nivelar superficie
                      int maxRange = PhysExConfig.DRAIN_SEARCH_RANGE.get();
                      Direction bestDir = null;
                      int bestDistance = Integer.MAX_VALUE;

                      for (Direction dir : dirs) {
                          BlockPos firstStep = pos.relative(dir);
                          if (!canWaterMoveInto(level, firstStep)) {
                              continue;
                          }

                          BlockPos cursor = firstStep;
                          for (int step = 1; step <= maxRange; step++) {
                              if (!level.isLoaded(cursor)) {
                                  break;
                              }
                              if (!canWaterMoveInto(level, cursor) && !isWaterSource(level.getBlockState(cursor))) {
                                  break;
                              }
                              if (canWaterMoveInto(level, cursor) && canWaterMoveInto(level, cursor.below())) {
                                  if (step < bestDistance) {
                                      bestDistance = step;
                                      bestDir = dir;
                                  }
                                  break;
                              }
                              cursor = cursor.relative(dir);
                          }
                      }

                      if (bestDir != null) {
                          moveWater(level, pos, pos.relative(bestDir));
                      }
                  }
              }

              private void displaceWater(ServerLevel level, BlockPos origin) {
                  List<Direction> dirs = shuffledHorizontalDirections();
                  for (Direction dir : dirs) {
                      BlockPos side = origin.relative(dir);
                      if (canWaterMoveInto(level, side)) {
                          level.setBlock(side, Blocks.WATER.defaultBlockState(), 3);
                          enqueueRegion(level, side);
                          return;
                      }
                  }

                  BlockPos above = origin.above();
                  if (canWaterMoveInto(level, above)) {
                      level.setBlock(above, Blocks.WATER.defaultBlockState(), 3);
                      enqueueRegion(level, above);
                      return;
                  }

                  for (Direction dir : dirs) {
                      BlockPos upSide = above.relative(dir);
                      if (canWaterMoveInto(level, upSide)) {
                          level.setBlock(upSide, Blocks.WATER.defaultBlockState(), 3);
                          enqueueRegion(level, upSide);
                          return;
                      }
                  }
              }

              private boolean tryEvaporate(ServerLevel level, BlockPos pos, RandomSource random) {
                  if (random.nextInt(140) != 0) {
                      return false;
                  }
                  if (!level.isDay() || level.isRainingAt(pos.above()) || !level.canSeeSky(pos.above())) {
                      return false;
                  }
                  float temp = level.getBiome(pos).value().getBaseTemperature();
                  if (temp < 1.5F) {
                      return false;
                  }
                  if (isWaterSource(level.getBlockState(pos.below()))) {
                      return false;
                  }
                  level.setBlock(pos, Blocks.AIR.defaultBlockState(), 3);
                  enqueueRegion(level, pos);
                  return true;
              }

              private void tryRainRefill(ServerLevel level, BlockPos pos, RandomSource random) {
                  if (random.nextInt(180) != 0) {
                      return;
                  }
                  if (!level.isRainingAt(pos)) {
                      return;
                  }
                  BlockState below = level.getBlockState(pos.below());
                  if (below.isAir() || (!below.isSolid() && !isWaterSource(below))) {
                      return;
                  }

                  // So enche se houver pelo menos 3 paredes/agua ao redor (formando uma bacia)
                  int supportSides = 0;
                  for (Direction dir : Direction.Plane.HORIZONTAL) {
                      BlockState side = level.getBlockState(pos.relative(dir));
                      if (side.isSolid() || isWaterSource(side)) {
                          supportSides++;
                      }
                  }
                  if (supportSides >= 3) {
                      level.setBlock(pos, Blocks.WATER.defaultBlockState(), 3);
                      enqueueRegion(level, pos);
                  }
              }

              private void moveWater(ServerLevel level, BlockPos from, BlockPos to) {
                  level.setBlock(from, Blocks.AIR.defaultBlockState(), 3);
                  level.setBlock(to, Blocks.WATER.defaultBlockState(), 3);
                  enqueueRegion(level, from);
                  enqueueRegion(level, to);
              }

              private void enqueueRegion(ServerLevel level, BlockPos center) {
                  enqueue(level, center);
                  enqueue(level, center.above());
                  enqueue(level, center.below());
                  for (Direction dir : Direction.Plane.HORIZONTAL) {
                      BlockPos side = center.relative(dir);
                      enqueue(level, side);
                      enqueue(level, side.above());
                  }
              }

              private void enqueue(ServerLevel level, BlockPos pos) {
                  ResourceKey<Level> dim = level.dimension();
                  ArrayDeque<BlockPos> queue = activeQueues.computeIfAbsent(dim, k -> new ArrayDeque<>());
                  Set<BlockPos> set = queuedSets.computeIfAbsent(dim, k -> new HashSet<>());

                  if (queue.size() >= MAX_QUEUE_SIZE) {
                      return;
                  }
                  BlockPos immutable = pos.immutable();
                  if (set.add(immutable)) {
                      queue.addLast(immutable);
                  }
              }

              private boolean isWaterSource(BlockState state) {
                  return state.is(Blocks.WATER) && state.getFluidState().isSource();
              }

              private boolean isPorous(BlockState state) {
                  return state.is(BlockTags.LEAVES) || state.is(Blocks.IRON_BARS);
              }

              private boolean canWaterMoveInto(ServerLevel level, BlockPos pos) {
                  if (pos.getY() <= level.getMinBuildHeight() || !level.isLoaded(pos)) {
                      return false;
                  }
                  BlockState state = level.getBlockState(pos);
                  if (state.isAir()) {
                      return true;
                  }
                  return state.is(Blocks.WATER) && !state.getFluidState().isSource();
              }

              private List<Direction> shuffledHorizontalDirections() {
                  List<Direction> dirs = new ArrayList<>(4);
                  dirs.add(Direction.NORTH);
                  dirs.add(Direction.SOUTH);
                  dirs.add(Direction.EAST);
                  dirs.add(Direction.WEST);
                  Collections.shuffle(dirs);
                  return dirs;
              }
          }
          EOF

      - name: Compilar o Mod (.jar)
        run: gradle build --no-daemon

      - name: Disponibilizar .jar para download
        uses: actions/upload-artifact@v4
        with:
          name: PhysExWater-1.20.1-Forge
          path: build/libs/*.jar
